<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dhan NSE Intraday Algo</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="logo">Dhan NSE Algo</span>
      <span id="brokerBadge" class="badge badge-blue">dhan</span>
      <span id="modeBadge"   class="badge badge-red">live</span>
      <span id="tfBadge"     class="tf-badge">5m</span>
    </div>
    <div class="header-right">
      <span id="clockEl" class="clock"></span>
      <span id="statusDot" class="status-dot idle" title="Engine status"></span>
      <span id="statusLabel" class="status-label">idle</span>
    </div>
  </header>

  <!-- Account strip -->
  <div class="account-strip">
    <div class="acct-stat">
      <div class="acct-label">Equity</div>
      <div class="acct-val" id="acctEquity">—</div>
    </div>
    <div class="acct-stat">
      <div class="acct-label">Session P&amp;L</div>
      <div class="acct-val pnl" id="acctPnl">—</div>
    </div>
    <div class="acct-stat">
      <div class="acct-label">Win rate</div>
      <div class="acct-val" id="acctWR">—</div>
    </div>
    <div class="acct-stat">
      <div class="acct-label">Trades</div>
      <div class="acct-val" id="acctTrades">0</div>
    </div>
    <div class="acct-stat wide">
      <div class="acct-label">Portfolio risk</div>
      <div class="risk-bar-wrap">
        <div class="risk-bar" id="riskBar"></div>
      </div>
      <div class="acct-val" id="acctRisk">0%</div>
    </div>
    <div class="acct-stat">
      <div class="acct-label">EOD phase</div>
      <div class="acct-val" id="acctEOD">—</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <label class="tf-label">Timeframe</label>
    <select id="tfSelect" class="tf-select">
      <option value="1">1 min</option>
      <option value="5" selected>5 min</option>
      <option value="15">15 min</option>
      <option value="30">30 min</option>
      <option value="60">1 hour</option>
    </select>
    <label class="toggle-label" title="When on, real Dhan quotes/bars/account are used but orders are simulated locally — no real order is sent">
      <input type="checkbox" id="paperChk" checked/>
      Paper trade
    </label>
    <button id="btnStart"    class="btn btn-green" onclick="apiStart()">Start engine</button>
    <button id="btnStop"     class="btn btn-red"   onclick="apiStop()">Stop</button>
    <button id="btnCloseAll" class="btn btn-amber"  onclick="apiCloseAll()">Close all</button>
    <button class="btn btn-token" onclick="promptUpdateToken()" title="Update Dhan access token">Update Token</button>
  </div>

  <!-- Main grid -->
  <div class="main-grid">
    <!-- Positions panel (Open / Closed / Engine Log tabs) -->
    <section class="panel panel-pos">
      <div class="panel-hdr pos-tabs">
        <div class="tab-bar">
          <button id="tabOpen" class="tab-btn active" onclick="switchPosTab('open')">
            Open positions <span id="posCount" class="count-badge">0</span>
          </button>
          <button id="tabClosed" class="tab-btn" onclick="switchPosTab('closed')">
            Closed positions <span id="closedCount" class="count-badge">0</span>
          </button>
          <button id="tabLog" class="tab-btn" onclick="switchPosTab('log')">
            Engine Log
          </button>
        </div>
        <label id="autoScrollWrap" class="toggle-label" style="display:none">
          <input type="checkbox" id="autoScrollChk" checked/>
          auto-scroll
        </label>
      </div>
      <div id="posTable" class="pos-table-wrap">
        <div class="empty-msg">No open positions</div>
      </div>
      <div id="closedTable" class="pos-table-wrap" style="display:none">
        <div class="empty-msg">No closed positions yet</div>
      </div>
      <div id="logFeed" class="log-feed" style="display:none"></div>
    </section>

    <!-- Screener panel -->
    <section class="panel panel-screen">
      <div class="panel-hdr">
        <span>Screener candidates</span>
        <button class="btn-sm" onclick="reloadScreener()">&#8635; Refresh</button>
      </div>
      <div id="screenerList" class="screener-list">
        <div class="empty-msg">Run engine to populate screener</div>
      </div>
    </section>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
